version: 2
updates:
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '37 6 12 * *'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - phoeluga
    versioning-strategy: increase
    ignore:
      - dependency-name: '@types/node'
        update-types:
          - 'version-update:semver-major'

  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: 'cron'
      cron: '12 7 18 * *'
      timezone: Europe/Berlin
    cooldown:
      default-days: 7
    open-pull-requests-limit: 15
    assignees:
      - phoeluga
